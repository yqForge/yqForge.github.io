<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">下班倒计时 Android 应用项目封面</title>
  <desc id="desc">展示下班剩余时间和工作日进度的移动应用界面插画</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#431407"/>
      <stop offset=".52" stop-color="#9a3412"/>
      <stop offset="1" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fde68a"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="34" stdDeviation="36" flood-color="#1c0a05" flood-opacity=".58"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1340" cy="160" r="255" fill="#fb7185" opacity=".12"/>
  <circle cx="215" cy="865" r="325" fill="#fbbf24" opacity=".1"/>
  <g fill="#fed7aa" opacity=".22">
    <circle cx="120" cy="130" r="5"/><circle cx="270" cy="210" r="8"/><circle cx="1440" cy="730" r="6"/>
    <circle cx="1310" cy="860" r="9"/><circle cx="520" cy="100" r="6"/><circle cx="1080" cy="180" r="4"/>
  </g>
  <g transform="translate(150 180)">
    <text x="0" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fed7aa" letter-spacing="5">OFF WORK</text>
    <text x="0" y="151" font-family="Arial, sans-serif" font-size="82" font-weight="800" fill="#fff">让每一段工作</text>
    <text x="0" y="246" font-family="Arial, sans-serif" font-size="82" font-weight="800" fill="#fff">都有清晰终点</text>
    <text x="3" y="310" font-family="Arial, sans-serif" font-size="23" fill="#fecdd3">Android 独立应用 · 工作时间进度管理</text>
    <g transform="translate(0 375)">
      <rect width="375" height="122" rx="25" fill="#fff" opacity=".1" stroke="#fff" stroke-opacity=".18"/>
      <text x="30" y="43" font-family="Arial, sans-serif" font-size="16" fill="#fed7aa">今日工作进度</text>
      <text x="30" y="86" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#fff">76%</text>
      <rect x="112" y="69" width="226" height="14" rx="7" fill="#fff" opacity=".16"/>
      <rect x="112" y="69" width="172" height="14" rx="7" fill="url(#progress)"/>
    </g>
    <g transform="translate(0 525)">
      <circle cx="18" cy="18" r="18" fill="#fbbf24"/>
      <path d="M11 18l5 5 10-11" fill="none" stroke="#7c2d12" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="50" y="25" font-family="Arial, sans-serif" font-size="19" fill="#ffedd5">简单、专注、按时结束</text>
    </g>
  </g>
  <g transform="translate(965 78) rotate(5 250 420)" filter="url(#shadow)">
    <rect width="490" height="845" rx="72" fill="#171717"/>
    <rect x="17" y="17" width="456" height="811" rx="58" fill="#fff7ed"/>
    <rect x="172" y="29" width="146" height="28" rx="14" fill="#171717"/>
    <text x="52" y="112" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#9a3412">星期二 · 工作日</text>
    <circle cx="413" cy="99" r="20" fill="#ffedd5"/>
    <g transform="translate(54 155)">
      <circle cx="191" cy="191" r="160" fill="none" stroke="#fed7aa" stroke-width="25"/>
      <circle cx="191" cy="191" r="160" fill="none" stroke="url(#progress)" stroke-width="25" stroke-dasharray="764 242" stroke-linecap="round" transform="rotate(-90 191 191)"/>
      <circle cx="191" cy="191" r="120" fill="url(#sun)" opacity=".13"/>
      <text x="191" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#9a3412">距离下班还有</text>
      <text x="191" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="51" font-weight="800" fill="#431407">01:42:36</text>
      <text x="191" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#c2410c">今天已完成 76%</text>
    </g>
    <g transform="translate(47 548)">
      <rect width="396" height="112" rx="24" fill="#fff" stroke="#fed7aa"/>
      <circle cx="51" cy="56" r="27" fill="#fef3c7"/>
      <path d="M51 39v18l12 8" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
      <text x="96" y="48" font-family="Arial, sans-serif" font-size="15" fill="#9a3412">今日下班时间</text>
      <text x="96" y="78" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#431407">18:00</text>
      <rect x="316" y="42" width="50" height="28" rx="14" fill="#fbbf24"/>
      <circle cx="352" cy="56" r="11" fill="#fff"/>
    </g>
    <g transform="translate(47 686)">
      <rect width="117" height="74" rx="20" fill="#ffedd5"/>
      <rect x="139" width="117" height="74" rx="20" fill="#ffe4e6"/>
      <rect x="278" width="117" height="74" rx="20" fill="#fef3c7"/>
      <text x="58" y="33" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#9a3412">开始</text>
      <text x="58" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#431407">09:00</text>
      <text x="197" y="33" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#9f1239">午休</text>
      <text x="197" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#4c0519">01:00</text>
      <text x="336" y="33" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#92400e">剩余</text>
      <text x="336" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#451a03">01:42</text>
    </g>
  </g>
</svg>
